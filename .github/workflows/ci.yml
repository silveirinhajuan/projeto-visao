name: VISÃO CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run fast tests
      run: |
        pytest visao/tests/test_brain.py visao/tests/test_integration.py visao/tests/test_inference.py visao/tests/test_multi_timescale.py visao/tests/test_task_boundary.py visao/governance/tests/ visao/reasoning/test_neuro_symbolic.py visao/memory/test_hippocampus.py tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install flake8 mypy

    - name: Lint with flake8
      run: |
        flake8 visao/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Type check with mypy
      run: |
        mypy visao/ --ignore-missing-imports
