[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "visao-research"
version = "1.0.0"
description = "VISÃO Research Harness — Reproducible Experiment Infrastructure"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["research*"]
exclude = ["research.tests*"]

[tool.setuptools.package-dir]
research = "research"
