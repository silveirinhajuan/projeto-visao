# VISÃO Research Harness — Ablation Study: VISÃO Mechanisms
# Test VISÃO with different mechanism combinations

name: ablation_visao
type: benchmark
seed: 42
n_seeds: 5
task_type: regression
output_dir: results
save_checkpoints: true
save_plots: true
verbose: true

dataset:
  name: mackey_glass
  params:
    n_train: 800
    n_test: 200
    tau: 17.0
    horizon: 1
    noise: 0.0

metrics:
  - mse
  - mae
  - rmse

models:
  - name: VISÃO-full
    params:
      n_hidden: 64
      lr: 0.02
      epochs: 1
      sparsity: 0.6
      consolidation: 8.0
      surprise_gain: 3.0
      lambda_decay: 0.0005
      meta_learn: true

  - name: VISÃO-no_meta
    params:
      n_hidden: 64
      lr: 0.02
      epochs: 1
      sparsity: 0.6
      consolidation: 8.0
      surprise_gain: 3.0
      lambda_decay: 0.0005
      meta_learn: false

  - name: VISÃO-no_consolidation
    params:
      n_hidden: 64
      lr: 0.02
      epochs: 1
      sparsity: 0.6
      consolidation: 0.0
      surprise_gain: 3.0
      lambda_decay: 0.0
      meta_learn: false

  - name: VISÃO-no_surprise
    params:
      n_hidden: 64
      lr: 0.02
      epochs: 1
      sparsity: 0.6
      consolidation: 8.0
      surprise_gain: 0.0
      lambda_decay: 0.0005
      meta_learn: false

  - name: VISÃO-baseline
    params:
      n_hidden: 64
      lr: 0.02
      epochs: 1
      sparsity: 0.0
      consolidation: 0.0
      surprise_gain: 0.0
      lambda_decay: 0.0
      meta_learn: false
